<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Conoce tu equipo · Especificaciones de smartphone</title>
  <meta name="description" content="Herramienta de formación: especificaciones de un smartphone explicadas para asesores comerciales.">
  <meta name="theme-color" content="#F2F3F5">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Conoce tu equipo">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="modulepreload" href="js/app.js?v=20261030b">
  <link rel="stylesheet" href="css/estilos.css?v=20261030b">
</head>
<body>
  <a class="saltar" href="#leyenda">Saltar a la lista de especificaciones</a>

  <header class="barra">
    <div class="marca">
      <span class="marca-icono" aria-hidden="true"></span>
      <div>
        <h1 id="titulo">Conoce tu equipo</h1>
        <p id="subtitulo" class="sub">Especificaciones explicadas para vender mejor</p>
      </div>
    </div>
    <button id="btn-recorrido" class="btn btn-primario" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span class="largo">Recorrido guiado</span><span class="corto">Recorrido</span>
    </button>
  </header>

  <main id="escenario" class="escenario" aria-label="Smartphone interactivo">
    <canvas id="lienzo" aria-hidden="true"></canvas>
    <svg id="lineas" class="lineas" aria-hidden="true"></svg>
    <div id="marcador" class="marcador" aria-hidden="true"></div>
    <div id="etiquetas" class="etiquetas" role="list" aria-label="Especificaciones"></div>
    <div id="vista2d" class="vista2d" hidden></div>
    <div id="cargando" class="cargando" role="status">
      <div class="cargando-tel" aria-hidden="true"></div>
      <p>Cargando el equipo…</p>
    </div>
  </main>

  <footer class="pie">
    <nav id="leyenda" class="leyenda" aria-label="Filtrar por categoría"></nav>
    <div class="pie-fila">
      <p id="pista" class="pista">Gira el equipo · toca una etiqueta</p>
      <button id="btn-vista" class="btn-texto" type="button">Vista 2D</button>
    </div>
  </footer>

  <!-- Popup de especificación -->
  <div id="fondo-popup" class="fondo-popup" hidden></div>
  <section id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="pp-titulo" hidden>
    <div class="pp-agarre" aria-hidden="true"></div>
    <header class="pp-cabeza">
      <div>
        <span id="pp-cat" class="pp-cat"></span>
        <h2 id="pp-titulo"></h2>
      </div>
      <button id="pp-cerrar" class="pp-cerrar" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="pp-cuerpo" id="pp-cuerpo">
      <h3>¿Qué es?</h3>
      <p id="pp-que"></p>
      <h3>Característica clave</h3>
      <ul class="gamas" id="pp-gamas"></ul>
      <h3>Beneficio para el cliente</h3>
      <p id="pp-beneficio"></p>
      <div class="frase">
        <span class="frase-et">Dile al cliente</span>
        <p id="pp-frase"></p>
      </div>
    </div>
    <footer id="pp-nav" class="pp-nav" hidden>
      <button id="pp-ant" class="btn btn-sec" type="button">← Anterior</button>
      <span id="pp-paso" class="pp-paso"></span>
      <button id="pp-sig" class="btn btn-primario" type="button">Siguiente →</button>
    </footer>
  </section>

  <noscript><p class="sin-js">Esta herramienta necesita JavaScript activado.</p></noscript>
  <script nomodule>document.getElementById("cargando").innerHTML="<p class=\"aviso\" style=\"position:static\">Tu navegador es muy antiguo para esta herramienta. Actualízalo o ábrela en Chrome, Safari, Edge o Firefox recientes.</p>";</script>
  <script type="module" src="js/app.js?v=20261030b"></script>
</body>
</html>
